<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dgg</title>
    <link rel="stylesheet" href="css/popupStyle.css">
    <script src="popup.js"></script>
</head>

<body>
    <div class="fullContainer">
       
        <div class="logoContainer">
            <div class="logo">
                <a href="https://www.destiny.gg/bigscreen" target="_blank">
                        <img src="/icon/dgglogo.png">
                    </a>
            </div>
            <div class="onlineHeader">
                <h1>live</h1>
            </div>
        </div>

        <div class="contentContainer">
            <div class="chatFrame">
                <!-- src is set by popup.js -->
                <iframe id="chatIframe" data-src="https://www.destiny.gg/embed/chat" width="100%" height="100%" frameBorder="0"></iframe>
            </div>
            <div class="linkersFrame">
                <!-- src is set by popup.js; sw.js serves linkers.ooo at the extension root -->
                <iframe id="linkersIframe" width="100%" height="100%" frameBorder="0"></iframe>
            </div>
        </div>
    
    </div>
</body>
</html>
